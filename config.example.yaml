tdx_home: ''
training_days: 120
panel_count: 3
default_sub_indicators:
- MACD
- KDJ
- RSI
- CCI
- BIAS
default_main_overlays:
- MA
ma_periods:
- 5
- 10
- 20
- 30
- 60
- 120
ma_enabled: true
ema_stack_enabled: true   # 自编 K 线常驻叠加均线开关
ai:
  provider: ''
  api_key: ''
  base_url: ''
  model: ''
  auth_style: x-api-key  # anthropic 鉴权方式: x-api-key(官方) / bearer(部分中转网关)
  send_chart: true       # AI 复盘附带K线截图（模型不支持时自动降级纯文本）
trading:
  default_buy_ratio: 1.0
  default_sell_ratio: 1.0
  stop_loss_pct: 0.0
  take_profit_pct: 0.0
mode:
  current: classic        # classic / timed / multi_tf / sector / comprehensive / quiz
  timed_seconds: 10       # 限时模式：每根K线秒数 (3/5/10/15/30)
  sector_peer_count: 3    # 板块联动：同板块股票数 (1-5)
  quiz_questions: 10      # 答题模式：每次会话题数
update:
  server_url: https://stock.maolige.com
  auto_check: true
  skip_version: ''
indicators:
  MACD:
    SHORT: 12
    LONG: 26
    M: 9
  KDJ:
    N: 9
    M1: 3
    M2: 3
  RSI:
    N: 6
  CCI:
    N: 14
  OBV: {}
  CR:
    N: 26
  TRIX:
    M1: 12
    M2: 20
  DMI:
    M1: 14
    M2: 6
  BIAS:
    L1: 6
    L2: 12
    L3: 24
  WR:
    N: 10
    N1: 6
  EXPMA:
    N1: 12
    N2: 50
  BBI:
    M1: 3
    M2: 6
    M3: 12
    M4: 20
  BOLL:
    N: 20
    P: 2
  捉妖大师:
    N1: 120
    N2: 60
    N3: 20
    M: 10
  MA30乖离:
    P: 10
    M: 30
  # 自编主图叠加：K 线常驻叠加均线
  # 短期链 EMA(C,10) -> EMA(,3) x4；长期链 EMA(C,45) -> EMA(,3) x4
  # 颜色是通达信写法；通达信 COLOR 后六位按 BGR 排列（color_order: BGR 会做通道转换）
  EMA_STACK:
    short_n: 10
    long_n: 45
    smooth_n: 3
    layers: 5
    short_draw: 4        # 通达信里「短期5」是 ":=" 隐藏项，这里默认也不画
    long_draw: 5
    short_color_tdx: FFA6FF
    long_color_tdx: 8F8F47
    color_order: BGR
    linewidth: 1.0
